<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova AI</title>
    <meta name="description" content="Nova AI — a GPT-style chat assistant powered by OpenAI." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <div class="shell">

        <!-- ══════════════ SIDEBAR ══════════════ -->
        <aside class="sidebar" id="sidebar">

            <div class="sidebar-top">
                <!-- Toggle + New Chat -->
                <div class="sidebar-actions">
                    <button class="icon-btn" id="sidebarToggle" title="Close sidebar" aria-label="Toggle sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <path d="M9 3v18" />
                        </svg>
                    </button>
                    <button class="icon-btn" id="newChatBtn" title="New chat" aria-label="New chat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                    </button>
                </div>

                <!-- History -->
                <nav class="history-list" id="historyList" aria-label="Chat history">
                    <p class="history-label">Today</p>
                    <!-- filled by JS -->
                </nav>
            </div>

            <!-- Sidebar footer / model badge -->
            <div class="sidebar-footer">
                <div class="model-badge">
                    <span class="model-dot"></span>
                    <span>GPT-4o-mini</span>
                </div>
            </div>
        </aside>

        <!-- ══════════════ MAIN AREA ══════════════ -->
        <div class="main" id="main">

            <!-- Topbar (mobile only / when sidebar is closed) -->
            <header class="topbar" id="topbar">
                <button class="icon-btn" id="openSidebar" title="Open sidebar" aria-label="Open sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <path d="M9 3v18" />
                    </svg>
                </button>
                <span class="topbar-title">Nova AI</span>
                <button class="icon-btn" id="newChatBtnMobile" title="New chat" aria-label="New chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                </button>
            </header>

            <!-- Chat messages -->
            <div class="chat-scroll" id="chatScroll">
                <div class="chat-content" id="chatWindow" role="log" aria-live="polite">
                    <!-- welcome shown by JS -->
                </div>
            </div>

            <!-- Input area -->
            <div class="input-area">
                <div class="input-box-wrap">
                    <form id="chatForm">
                        <div class="input-box" id="inputBox">
                            <textarea id="messageInput" rows="1" placeholder="Message Nova…" aria-label="Message input"
                                autocomplete="off"></textarea>
                            <button type="submit" id="sendBtn" aria-label="Send message" disabled>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                                </svg>
                            </button>
                        </div>
                    </form>
                    <p class="input-hint">Nova can make mistakes. Check important info.</p>
                </div>
            </div>

        </div><!-- /main -->

        <!-- Mobile overlay -->
        <div class="overlay" id="overlay"></div>

    </div><!-- /shell -->

    <script src="app.js"></script>
</body>

</html>
